<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1280, initial-scale=1" />
    <title>CommonMesh demo thumbnail</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; }
      body {
        position: relative;
        color: #f7fbf8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background-color: #0a2a22;
      }
      body::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
        background-size: 38px 38px;
        pointer-events: none;
      }
      .copy {
        position: absolute;
        z-index: 2;
        left: 66px;
        top: 66px;
        width: 445px;
      }
      .eyebrow {
        display: inline-block;
        padding: 9px 14px;
        border: 1px solid rgba(159, 241, 195, .38);
        border-radius: 999px;
        background: rgba(9, 35, 28, .64);
        color: #a6efc5;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: .12em;
      }
      h1 {
        margin: 30px 0 16px;
        font-size: 78px;
        line-height: .96;
        letter-spacing: -.055em;
      }
      .promise {
        margin: 0;
        max-width: 420px;
        color: #d5e6dd;
        font-size: 30px;
        font-weight: 600;
        line-height: 1.18;
        letter-spacing: -.025em;
      }
      .chips { margin-top: 34px; }
      .chip {
        display: inline-block;
        margin: 0 8px 10px 0;
        padding: 10px 13px;
        border-radius: 10px;
        color: #eaf5ef;
        background: rgba(255, 255, 255, .09);
        border: 1px solid rgba(255, 255, 255, .12);
        font-size: 17px;
        font-weight: 700;
      }
      .trust {
        margin-top: 29px;
        color: #a6efc5;
        font-size: 17px;
        font-weight: 750;
      }
      .trust strong { color: #fff; }
      .product-card {
        position: absolute;
        z-index: 2;
        top: 51px;
        right: -58px;
        width: 720px;
        height: 618px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, .32);
        border-radius: 24px;
        background: #f7f9f7;
        box-shadow: 0 28px 80px rgba(0, 0, 0, .38);
        transform: rotate(-1.3deg);
      }
      .product-card img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 44% 9%;
      }
      .accent {
        position: absolute;
        z-index: 3;
        right: 68px;
        bottom: 61px;
        padding: 13px 17px;
        border-radius: 14px;
        background: #eef8f1;
        color: #166239;
        border: 1px solid #b9dfc7;
        box-shadow: 0 12px 35px rgba(0,0,0,.22);
        font-size: 19px;
        font-weight: 850;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="copy">
        <div class="eyebrow">2026 WEBMCP CHALLENGE</div>
        <h1>CommonMesh</h1>
        <p class="promise">Human-approved coordination through structured browser tools.</p>
        <div class="chips">
          <span class="chip">9 WebMCP tools</span>
          <span class="chip">Exact-digest approval</span>
          <span class="chip">Selective repair</span>
        </div>
        <p class="trust"><strong>Agents propose.</strong> Humans approve execution.</p>
      </section>
      <section class="product-card" aria-label="CommonMesh proposed-plan interface">
        <img src="../screenshots/10-final-committed-repair.png" alt="CommonMesh with WebMCP live and the selective repair committed at one hundred percent coverage" />
      </section>
      <div class="accent">PROPOSED → APPROVED → COMMITTED</div>
    </main>
  </body>
</html>
